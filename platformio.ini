[platformio]
# Изменили дефолтный профиль на правильный для вашей платы
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
; Вернитесь на стабильную ветку, например, ESP-IDF 5.1.4 или 5.2.x
platform = espressif32 @ 6.6.0
board = esp32doit-devkit-v1
framework = espidf

# Ваши настройки для Serial Monitor и прошивки
monitor_speed = 2000000
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800

build_type = release
